[project]
name = "strata-eval"
version = "0.0.0"
requires-python = ">=3.11"
dependencies = [
  "pyyaml>=6.0",
  "strata-pipeline",
]

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.6"]

[tool.uv.sources]
strata-pipeline = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["strata_eval"]
