[project]
name = "strata-pipeline"
version = "0.0.0"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.9",
  "polars>=1.9",
  "pyarrow>=17.0",
  "numpy>=2.1",
  "scikit-learn>=1.5",
  "pyyaml>=6.0",
]

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.6", "mypy>=1.11", "datamodel-code-generator>=0.26", "types-PyYAML>=6.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["strata_pipeline"]
